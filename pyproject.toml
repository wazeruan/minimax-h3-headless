[project]
name = "minimax-h3-headless"
version = "0.1.0"
description = "SSH-first MiniMax H3 deployment gateway for Linux and Slurm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
inference = [
  "cuda-tile; sys_platform == 'linux'",
  "huggingface-hub>=0.34,<2",
  # H3 support is actively maintained in SGLang Diffusion. Keep the lockfile
  # reproducible, but do not freeze this deployment to the day-zero release.
  "sglang[diffusion]>=0.5.17; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[project.scripts]
h3-gateway = "minimax_h3_headless.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_h3_headless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
cuda-tile = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
